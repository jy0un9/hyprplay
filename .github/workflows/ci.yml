name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-tools-dev \
            libtag1-dev libmpv-dev libsecret-1-dev pkg-config ffmpeg
      - name: Build and run unit tests
        run: |
          cd tests
          qmake6 tests.pro
          make -j"$(nproc)"
          HYPRPLAY_TEST_AO=null QT_QPA_PLATFORM=offscreen ./hyprplay-tests

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            libmpv-dev libtag1-dev libsecret-1-dev pkg-config
      - name: Build app
        run: |
          qmake6 hyprplay.pro PREFIX=/usr
          make -j"$(nproc)"
      - name: Offscreen QML smoke
        run: |
          QT_QPA_PLATFORM=offscreen timeout 5 ./hyprplay-bin || test $? -eq 124
      - name: Validate desktop entry
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate desktop/hyprplay.desktop
      - name: Validate AppStream (structure)
        run: |
          sudo apt-get install -y appstream
          # URLs may 404 until the GitHub release exists; treat as soft check.
          appstreamcli validate desktop/org.jy0un9.hyprplay.metainfo.xml || true
